services:
  - type: web
    name: koshbill-erp
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: KBE_MONGODB_URI
        sync: false
      - key: KBE_MONGODB_DB_NAME
        value: koshbill_erp
